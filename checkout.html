<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চেকআউট - Keshtaru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        .navbar-custom { background-color: #2c4c3b; }
        .checkout-box { background: #f8f9fa; padding: 20px; border-radius: 10px; border: 1px solid #ddd; }
        .form-label { font-weight: bold; color: #2c4c3b; }
        .error-msg { color: red; font-size: 0.85rem; display: none; margin-top: 5px; }
    </style>

</head>
<body>

    <!-- ==========================================
         নেভিগেশন বার (Navbar)
    =========================================== -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Keshtaru Checkout</a>
        </div>
    </nav>



    <!-- ==========================================
         মূল চেকআউট সেকশন শুরু
    =========================================== -->
    <div class="container py-5">
        <div class="row">
            
            <!-- 
                বাম দিকের কলাম (কাস্টমারের তথ্য নেওয়ার ফর্ম) 
            -->
            <div class="col-md-7 mb-4">
                <h3 class="fw-bold mb-4 border-bottom pb-2">ডেলিভারি তথ্য (Billing Details)</h3>
                
                <form id="checkout-form">
                    
                    <!-- নাম ইনপুট -->
                    <div class="mb-3">
                        <label class="form-label">আপনার নাম *</label>
                        <input type="text" id="c-name" class="form-control form-control-lg" placeholder="যেমন: Galib Rahman" required>
                    </div>


                    <!-- ফোন নম্বর ইনপুট (১১ ডিজিট ভ্যালিডেশন হবে) -->
                    <div class="mb-3">
                        <label class="form-label">ফোন নম্বর *</label>
                        <input type="number" id="c-phone" class="form-control form-control-lg" placeholder="01XXXXXXXXX" required>
                        <div id="phone-error" class="error-msg">অবশ্যই ১১ ডিজিটের সঠিক মোবাইল নম্বর দিতে হবে!</div>
                    </div>


                    <!-- ইমেইল ইনপুট (@ ভ্যালিডেশন হবে) -->
                    <div class="mb-3">
                        <label class="form-label">ইমেইল অ্যাড্রেস *</label>
                        <input type="email" id="c-email" class="form-control form-control-lg" placeholder="example@email.com" required>
                        <div id="email-error" class="error-msg">সঠিক ইমেইল অ্যাড্রেস দিন (যাতে @ এবং . থাকে)!</div>
                    </div>


                    <!-- জিপিএস লোকেশন বাটন ও ইনপুট -->
                    <div class="mb-4 mt-4 p-3 border rounded bg-white shadow-sm">
                        <label class="form-label text-primary"><i class="bi bi-geo-alt-fill"></i> ডেলিভারি লোকেশন *</label>
                        
                        <!-- [বর্তমান লোকেশন নিন] বাটন -->
                        <button type="button" id="gps-btn" class="btn btn-outline-primary w-100 mb-3 fw-bold">
                            📍 [বর্তমান লোকেশন নিন]
                        </button>
                        
                        <p id="gps-status" class="text-success fw-bold" style="font-size: 0.9rem; display: none;">✔ ম্যাপ লোকেশন নেওয়া হয়েছে!</p>
                        
                        <!-- গুগল ম্যাপের লিংকটি এখানে অটোমেটিক বসবে (কাস্টমার দেখতে পাবে না) -->
                        <input type="hidden" id="c-map-link" value="লোকেশন দেওয়া হয়নি">

                        <textarea id="c-address" class="form-control mt-2" rows="2" placeholder="বিস্তারিত ঠিকানা লিখুন (বাসা/রোড নম্বর)" required></textarea>
                    </div>

                </form>
            </div>



            <!-- 
                ডান দিকের কলাম (অর্ডার সামারি বা হিসাব-নিকাশ) 
            -->
            <div class="col-md-5">
                <div class="checkout-box shadow-sm">
                    <h4 class="fw-bold mb-4 border-bottom pb-2">অর্ডার সামারি</h4>
                    
                    <div class="d-flex justify-content-between mb-2">
                        <span id="summary-name" class="fw-bold text-muted">প্রোডাক্ট লোড হচ্ছে...</span>
                        <span id="summary-qty" class="fw-bold">x 0</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                        <span>মূল্য:</span>
                        <span id="summary-price" class="fw-bold text-success">৳ ০</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-4 fs-5 fw-bold">
                        <span>সর্বমোট (Total):</span>
                        <span id="total-price" class="text-danger">৳ ০</span>
                    </div>

                    <!-- [Place Order] বাটন -->
                    <button type="button" id="place-order-btn" class="btn btn-success btn-lg w-100 fw-bold shadow">
                        [Place Order] - অর্ডার সম্পন্ন করুন
                    </button>
                </div>
            </div>

        </div>
    </div>



    <!-- ==========================================
         জাভাস্ক্রিপ্ট (লজিক ও ভ্যালিডেশন)
    =========================================== -->
    <script>
        // এখানে আপনার আগের প্রোডাক্ট ডাটাবেসটি রাখতে হবে যেন চেকআউট পেজ দাম হিসাব করতে পারে
        const productsDB = {
            "wide-comb": { name: "Sandalwood Extra Wide Teeth Comb", price: 350 },
            "narrow-comb": { name: "Sandalwood Narrow Teeth Comb", price: 320 },
            "peach-comb": { name: "Peach Wood Comb", price: 250 },
            "magic-oil": { name: "Magic Essence Hair Oil", price: 300 },
            "root-oil": { name: "Root Care Herbal Essence Hair Oil", price: 320 },
            "silk-oil": { name: "Silk Secret Shine Therapy Hair Oil", price: 350 },
            "aloevera-pack": { name: "Aloevera Hair Pack", price: 200 },
            "beetroot-pack": { name: "Beetroot Hair Pack", price: 200 },
            "chlorophyll-pack": { name: "Chlorophyll Hair Pack", price: 220 },
            "mehedi-pack": { name: "Mehedi Hair Pack", price: 150 }
        };

        // URL থেকে প্রোডাক্টের আইডি এবং পরিমাণ (Qty) বের করা
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const qty = parseInt(urlParams.get('qty')) || 1;

        let selectedProduct = null;
        let totalPrice = 0;

        // প্রোডাক্টের তথ্য সামারি বক্সে বসানো
        if(productId && productsDB[productId]) {
            selectedProduct = productsDB[productId];
            totalPrice = selectedProduct.price * qty;

            document.getElementById('summary-name').textContent = selectedProduct.name;
            document.getElementById('summary-qty').textContent = `x ${qty}`;
            document.getElementById('summary-price').textContent = `৳ ${selectedProduct.price}`;
            document.getElementById('total-price').textContent = `৳ ${totalPrice}`;
        } else {
            alert("কোনো প্রোডাক্ট সিলেক্ট করা হয়নি!");
            window.location.href = "index.html";
        }


        /* ==========================================
           [বর্তমান লোকেশন নিন] বাটনের জিপিএস লজিক
        ========================================== */
        document.getElementById('gps-btn').addEventListener('click', function() {
            const gpsBtn = document.getElementById('gps-btn');
            const gpsStatus = document.getElementById('gps-status');
            const mapLinkInput = document.getElementById('c-map-link');

            gpsBtn.innerHTML = "⏳ লোকেশন খোঁজা হচ্ছে...";

            // ব্রাউজারের লোকেশন পারমিশন চাওয়া
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        // যদি কাস্টমার Allow করে (লোকেশন পাওয়া গেছে)
                        let lat = position.coords.latitude;
                        let lon = position.coords.longitude;
                        
                        // গুগল ম্যাপের লিংক তৈরি করা
                        let googleMapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                        mapLinkInput.value = googleMapsLink;
                        
                        gpsBtn.classList.replace('btn-outline-primary', 'btn-success');
                        gpsBtn.innerHTML = "✔ লোকেশন যুক্ত হয়েছে";
                        gpsStatus.style.display = "block";
                    },
                    function(error) {
                        // যদি কাস্টমার Deny করে বা জিপিএস অফ থাকে
                        alert("লোকেশন পাওয়া যায়নি! দয়া করে আপনার ডিভাইসের লোকেশন অন করুন অথবা নিচে ম্যানুয়ালি ঠিকানা লিখুন।");
                        gpsBtn.innerHTML = "📍 [বর্তমান লোকেশন নিন]";
                    }
                );
            } else {
                alert("আপনার ব্রাউজার জিপিএস সাপোর্ট করে না!");
            }
        });


        /* ==========================================
           [Place Order] বাটনের ভ্যালিডেশন ও হোয়াটসঅ্যাপ লজিক
        ========================================== */
        document.getElementById('place-order-btn').addEventListener('click', function() {
            
            // ইনপুট ফিল্ডের ভ্যালুগুলো নেওয়া
            let name = document.getElementById('c-name').value.trim();
            let phone = document.getElementById('c-phone').value.trim();
            let email = document.getElementById('c-email').value.trim();
            let address = document.getElementById('c-address').value.trim();
            let mapLink = document.getElementById('c-map-link').value;

            // এরর মেসেজগুলো প্রথমে হাইড করা
            document.getElementById('phone-error').style.display = "none";
            document.getElementById('email-error').style.display = "none";

            let isValid = true;

            // ১. ফোন নম্বর চেক (অবশ্যই ১১ ডিজিট এবং ০ দিয়ে শুরু হতে হবে)
            if (phone.length !== 11 || !phone.startsWith("01")) {
                document.getElementById('phone-error').style.display = "block";
                isValid = false;
            }

            // ২. ইমেইল চেক (@ এবং . আছে কি না)
            if (!email.includes("@") || !email.includes(".")) {
                document.getElementById('email-error').style.display = "block";
                isValid = false;
            }

            // ৩. নাম ও ঠিকানা ফাঁকা আছে কি না চেক
            if(name === "" || address === "") {
                alert("দয়া করে নাম এবং বিস্তারিত ঠিকানা পূরণ করুন!");
                isValid = false;
            }

            // যদি সব তথ্য সঠিক থাকে, তবেই হোয়াটসঅ্যাপে মেসেজ পাঠাবে
            if(isValid) {
                let whatsappNumber = "8801325763779"; // আপনার নম্বর
                
                // সুন্দর করে সাজানো হোয়াটসঅ্যাপ মেসেজ
                let message = `*নতুন অর্ডার এসেছে!* 🛍️

👤 *নাম:* ${name}
📞 *ফোন:* ${phone}
📧 *ইমেইল:* ${email}

📦 *প্রোডাক্ট:* ${selectedProduct.name}
🔢 *পরিমাণ:* ${qty} টি
💰 *সর্বমোট বিল:* ৳ ${totalPrice}

📍 *ঠিকানা:* ${address}
🗺️ *ম্যাপ লিংক:* ${mapLink}`;

                // হোয়াটসঅ্যাপ ওপেন করা
                let waLink = "https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(message);
                window.open(waLink, '_blank');
            }
        });

    </script>
</body>
</html>
