<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোডাক্ট ডিটেইলস - Keshtaru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #2c4c3b; }
        .brand-logo { height: 65px; object-fit: contain; }
        .product-img-main { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; }
        .related-product-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background-color: #fff; padding: 10px;}
        .product-card { transition: 0.3s; overflow: hidden; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="image/logo.png" alt="Keshtaru Logo" class="brand-logo rounded-circle bg-white p-1">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto fw-semibold fs-5">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="index.html#products">Our Products</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Product Details Section -->
    <div class="container py-5 mb-4">
        <div class="row align-items-center">
            <!-- Product Image -->
            <div class="col-md-6 mb-4 mb-md-0">
                <img id="main-image" src="" alt="Product Image" class="product-img-main shadow-sm border">
            </div>
            <!-- Product Details -->
            <div class="col-md-6 ps-md-5">
                <h2 id="main-title" class="fw-bold mb-3">লোডিং হচ্ছে...</h2>
                <h3 id="main-price" class="text-success fw-bold mb-4"></h3>
                
                <h5 class="fw-bold mb-3">বিবরণ (Description):</h5>
                <p id="main-desc" class="text-muted mb-4" style="line-height: 1.8;"></p>
                
                <div class="d-flex align-items-center mb-4">
                    <label for="quantity" class="fw-bold me-3 fs-5">পরিমাণ (Qty):</label>
                    <input type="number" id="quantity" class="form-control text-center fs-5" value="1" min="1" style="width: 100px;">
                </div>
                
                <a id="order-btn" href="#" target="_blank" class="btn btn-success btn-lg w-100 fw-bold shadow-sm py-3">
                    অর্ডার করুন (Order Now)
                </a>
            </div>
        </div>
    </div>

    <!-- Dynamic "You Can Also Buy" Section -->
    <div class="bg-light py-5">
        <div class="container">
            <h4 class="fw-bold mb-4 text-center border-bottom pb-3" style="color: #2c4c3b;">You can also buy (আরও দেখতে পারেন)</h4>
            <!-- এই কন্টেইনারের ভেতরে জাভাস্ক্রিপ্ট অটোমেটিক প্রোডাক্ট বসিয়ে দেবে -->
            <div class="row justify-content-center g-4" id="suggestion-container">
                <!-- Data will be loaded here dynamically -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-white py-4 text-center" style="background-color: #1f3629;">
        <div class="container">
            <p class="mb-0">© 2026 Keshtaru | সকল অধিকার সংরক্ষিত</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- সম্পূর্ণ ডাটাবেস এবং ফাংশনালিটি -->
    <script>
        const productsDB = {
            "wide-comb": { name: "Sandalwood Extra Wide Teeth Comb", price: "৳ ৩৫০", image: "image/Comb/Sandalwood extra wide teeth comb.jpg", description: "বড় দাঁতের এই চন্দন কাঠের চিরুনি চুলের জট ছাড়াতে এবং চুল পড়া কমাতে দারুণ কার্যকরী।" },
            "narrow-comb": { name: "Sandalwood Narrow Teeth Comb", price: "৳ ৩২০", image: "image/Comb/Sandalwood narrow teeth comb.jpg", description: "নরমাল চুল সাজানোর জন্য ১০০% আসল চন্দন কাঠের চিকন দাঁতের চিরুনি।" },
            "peach-comb": { name: "Peach Wood Comb", price: "৳ ২৫০", image: "image/Comb/Peach wood (1).jpg", description: "পিচ কাঠের তৈরি এই চিরুনি স্ক্যাল্পের স্বাস্থ্য ভালো রাখে এবং চুল মসৃণ করে।" },
            "peach-comb-1": { name: "Peach Wood Comb 1", price: "৳ 3৫০", image: "image/Comb/Peach wood (2).jpg", description: "পিচ কাঠের তৈরি এই চিরুনি স্ক্যাল্পের স্বাস্থ্য ভালো রাখে এবং চুল মসৃণ করে।" },
            "peach-comb-2": { name: "Peach Wood Comb 2", price: "৳ ৫০", image: "image/Comb/Peach wood (3).jpg", description: "পিচ কাঠের তৈরি এই চিরুনি স্ক্যাল্পের স্বাস্থ্য ভালো রাখে এবং চুল মসৃণ করে।" },
            "peach-comb-3": { name: "Peach Wood Comb 3", price: "৳ 1৫০", image: "image/Comb/Peach wood (4).jpg", description: "পিচ কাঠের তৈরি এই চিরুনি স্ক্যাল্পের স্বাস্থ্য ভালো রাখে এবং চুল মসৃণ করে।" },

            "magic-oil": { name: "Magic Essence Hair Oil", price: "৳ ৩০০", image: "image/oil/Magic essence hair oil.jpg", description: "চুলকে গোড়া থেকে মজবুত করতে এবং দ্রুত বৃদ্ধিতে সহায়তা করে ম্যাজিক এসেন্স হেয়ার অয়েল।" },
            "root-oil": { name: "Root Care Herbal Essence Hair Oil", price: "৳ ৩২০", image: "image/oil/Root care herbal essence hair oil.jpg", description: "বিশেষভাবে রুক্ষ ও ড্যামেজ চুলের যত্ন নিতে তৈরি রুট কেয়ার হারবাল হেয়ার অয়েল।" },
            "silk-oil": { name: "Silk Secret Shine Therapy Hair Oil", price: "৳ ৩৫০", image: "image/oil/Silk secret shine therapy hair oil.jpg", description: "চুলের সিল্কি ভাব ধরে রাখতে এবং ন্যাচারাল সাইন ফিরিয়ে আনতে সিল্ক সিক্রেট অয়েল।" },
            
            "aloevera-pack": { name: "Aloevera Hair Pack", price: "৳ ২০০", image: "image/hair pack/aloevera hair pack.jpg", description: "অ্যালোভেরার প্রাকৃতিক পুষ্টিতে ভরপুর যা স্ক্যাল্পকে ঠান্ডা রাখে এবং খুশকি দূর করে।" },
            "beetroot-pack": { name: "Beetroot Hair Pack", price: "৳ ২০০", image: "image/hair pack/beetroot hair pack.jpg", description: "বিটরুটের নির্যাস যুক্ত যা চুলে প্রাকৃতিক লালচে আভা আনে এবং পুষ্টি জোগায়।" },
            "chlorophyll-pack": { name: "Chlorophyll Hair Pack", price: "৳ ২২০", image: "image/hair pack/chlorophyll hair pack.jpg", description: "ক্লোরোফিলের শক্তি দিয়ে চুলের গোড়া শক্ত করে এবং অকালে চুল পাকা রোধ করে।" },
            "mehedi-pack": { name: "Mehedi Hair Pack", price: "৳ ১৫০", image: "image/hair pack/mehedi hair pack.jpg", description: "১০০% খাঁটি মেহেদী পাতার গুঁড়ো, যা চুলে চমৎকার রং এবং সিল্কি ভাব নিয়ে আসে।" }
             
        };

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if(productId && productsDB[productId]) {
            const product = productsDB[productId];
            
            // মেইন প্রোডাক্ট লোড করা
            document.title = product.name + " - Keshtaru";
            document.getElementById('main-image').src = product.image;
            document.getElementById('main-title').textContent = product.name;
            document.getElementById('main-price').textContent = product.price;
            document.getElementById('main-desc').textContent = product.description;
            
            // হোয়াটস্যাপ মেসেজ সুন্দর করে সাজানো (লিংক সহ)
            document.getElementById('order-btn').addEventListener('click', function(e) {
                e.preventDefault(); 
                
                let qty = document.getElementById('quantity').value; 
                let whatsappNumber = "8801325763779"; // আপনার নম্বর
                
                // কাস্টমার যেই পেজে আছে, সেই পেজের লিংক অটোমেটিক কপি করবে
                let currentUrl = window.location.href; 
                
                // অ্যাসথেটিক মেসেজ ফরম্যাট
                let message = `হ্যালো *Keshtaru*! 🌿
আমি আপনাদের ওয়েবসাইট থেকে একটি প্রোডাক্ট অর্ডার করতে চাই।

🛍️ *প্রোডাক্ট:* ${product.name}
💵 *মূল্য:* ${product.price}
📦 *পরিমাণ:* ${qty} টি

🔗 *প্রোডাক্ট লিংক:* ${currentUrl}

দয়া করে অর্ডারটি কনফার্ম করুন এবং ডেলিভারি প্রসেসটি জানাবেন। ধন্যবাদ! ✨`;

                // হোয়াটসঅ্যাপের লিংক তৈরি করে নতুন ট্যাবে ওপেন করা
                let waLink = "https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(message);
                window.open(waLink, '_blank');
            });

            // ডায়নামিক 'You can also buy' সেকশন তৈরি করা
            const suggestionContainer = document.getElementById('suggestion-container');
            let allKeys = Object.keys(productsDB);
            
            // যে প্রোডাক্টটি দেখছি সেটি বাদে বাকিগুলো ফিল্টার করা
            allKeys = allKeys.filter(key => key !== productId);
            
            // র‍্যান্ডমলি ৪টি প্রোডাক্ট বেছে নেওয়া
            allKeys.sort(() => 0.5 - Math.random());
            let selectedKeys = allKeys.slice(0, 4);
            
            selectedKeys.forEach(key => {
                let p = productsDB[key];
                let cardHTML = `
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="card product-card h-100 shadow-sm border-0 bg-white">
                        <img src="${p.image}" class="card-img-top related-product-img" alt="${p.name}">
                        <div class="card-body text-center p-3">
                            <h6 class="card-title fw-bold" style="font-size: 0.9rem;">${p.name}</h6>
                            <p class="text-success fw-bold mb-2">${p.price}</p>
                            <a href="product-details.html?id=${key}" class="btn btn-outline-success btn-sm w-100">বিস্তারিত দেখুন</a>
                        </div>
                    </div>
                </div>`;
                suggestionContainer.innerHTML += cardHTML;
            });

        } else {
            // ভুল লিংকের জন্য
            document.getElementById('main-title').textContent = "প্রোডাক্ট পাওয়া যায়নি!";
            document.getElementById('main-desc').textContent = "আপনি যে প্রোডাক্টটি খুঁজছেন তা হয়তো রিমুভ করা হয়েছে অথবা লিংকটি ভুল। দয়া করে হোম পেজে ফিরে যান।";
            document.getElementById('order-btn').style.display = "none";
        }
    </script>
</body>
</html>
