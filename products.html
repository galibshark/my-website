<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোডাক্টস - শুদ্ধ তেল</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar same রাখো (উপরের কোড থেকে কপি করে নাও) -->

    <div class="container py-5">
        <h2 class="text-center mb-5">আমাদের সকল প্রোডাক্ট</h2>
        
        <div class="row">
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card">
                    <img src="https://source.unsplash.com/400x300/?soybean-oil" class="card-img-top">
                    <div class="card-body">
                        <h5>সয়াবিন অয়েল</h5>
                        <p>১ লিটার - ১৮০ টাকা<br>৫ লিটার - ৮৫০ টাকা</p>
                        <button class="btn btn-success">অর্ডার করুন</button>
                    </div>
                </div>
            </div>
            <!-- আরও প্রোডাক্ট যোগ করো -->
        </div>
    </div>

    <!-- Footer same -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
